spring:
  application:
    name: gateway-service
  data:
    redis:
      # RequestRateLimiter가 토큰을 세는 저장소. 도커에서는 REDIS_HOST=redis가 주입되고,
      # 로컬 실행이면 콜론 뒤 기본값(localhost)을 쓴다. (product/order와 같은 규약)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1
            - name: JwtFilter # JwtFilter ??


        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/product-service/**
          filters:
            - StripPrefix=1
            - name: JwtFilter # JwtFilter ??
            # 재고 조회는 가볍지만 선착순엔 모두가 때리는 경로다. 사람이 상품 페이지를 보는 건
            # 초당 1~2건인데, 키(IP/사용자)당 초당 100건 + 순간 버스트 200건이면 정상 사용자엔
            # 여유롭고 스크립트성 폭주만 걸린다. 넘으면 즉시 429 (뒤 서비스로 안 넘어감).
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order-service/**
          filters:
            - StripPrefix=1
            - name: JwtFilter # JwtFilter ??
            # 주문은 Feign 체인이 무거워 ~250 req/s에서 포화(Day 2). 사용자당 초당 20건 +
            # 버스트 40건으로 묶어, 한 사용자가 몰아쳐도 전체가 무너지지 않게 한다.
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40


        - id: wishlist-service
          uri: lb://wishlist-service
          predicates:
            - Path=/wishlist-service/**
          filters:
            - StripPrefix=1
            - name: JwtFilter # JwtFilter ??

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
          filters:
            - StripPrefix=1
            - name: JwtFilter # JwtFilter ??

      default-filters:
        - name: GlobalFilter
          args:
            baseMessage: "Spring Cloud Gateway Global Filter"
            preLogger: true
            postLogger: true

server:
  port: 8000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30  # 로컬에서 서비스 재기동 시 다른 서비스가 빨리 인지하도록 짧게 (원래 600이라 재시작이 10분간 반영 안 됐음)
    disable-delta: true
    # 로컬 실행/도커 실행에 따라 Eureka 서버 주소가 다르므로(127.0.0.1 vs eureka-server 컨테이너),
    # EUREKA_URL 환경변수가 있으면 그 값을, 없으면 콜론 뒤 기본값(로컬 주소)을 쓰도록 분기한다.
    service-url:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8761/eureka}

  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true
    instance-id: gateway-service:${random.value}
    non-secure-port-enabled: true
    metadata-map:
      instanceId: gateway-service:${random.value}




management:
  endpoints:
    web:
      exposure:
        include: health, info  # health ????? ???
  health:
    default-indicator-status: UP  # ?? ??? UP?? ??
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

jwt:
  # secret 값을 코드에 직접 적으면 git에 그대로 노출되므로, 실행 시 환경변수(JWT_SECRET)에서 주입받는다.
  # 로컬 실행: .env 파일의 JWT_SECRET / 도커 실행: docker-compose environment의 JWT_SECRET
  secret: ${JWT_SECRET}
  expiration: 3600000

logging:
  level:
    # 부하 중 모든 요청마다 DEBUG 로그를 쏟으면 게이트웨이 CPU를 크게 먹는다.
    # 디버깅이 필요할 때만 DEBUG로 올리고, 평소엔 INFO.
    org.springframework.cloud.gateway: INFO