spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1
            - name: JwtFilter # JwtFilter ??


        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/product-service/**
          filters:
            - StripPrefix=1
            - name: JwtFilter # JwtFilter ??

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order-service/**
          filters:
            - StripPrefix=1
            - name: JwtFilter # JwtFilter ??


        - id: wishlist-service
          uri: lb://wishlist-service
          predicates:
            - Path=/wishlist-service/**
          filters:
            - StripPrefix=1
            - name: JwtFilter # JwtFilter ??

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
          filters:
            - StripPrefix=1
            - name: JwtFilter # JwtFilter ??

      default-filters:
        - name: GlobalFilter
          args:
            baseMessage: "Spring Cloud Gateway Global Filter"
            preLogger: true
            postLogger: true

server:
  port: 8000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 600 # 5??? ??
    disable-delta: true
    # 로컬 실행/도커 실행에 따라 Eureka 서버 주소가 다르므로(127.0.0.1 vs eureka-server 컨테이너),
    # EUREKA_URL 환경변수가 있으면 그 값을, 없으면 콜론 뒤 기본값(로컬 주소)을 쓰도록 분기한다.
    service-url:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8761/eureka}

  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true
    instance-id: gateway-service:${random.value}
    non-secure-port-enabled: true
    metadata-map:
      instanceId: gateway-service:${random.value}




management:
  endpoints:
    web:
      exposure:
        include: health, info  # health ????? ???
  health:
    default-indicator-status: UP  # ?? ??? UP?? ??
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

jwt:
  # secret 값을 코드에 직접 적으면 git에 그대로 노출되므로, 실행 시 환경변수(JWT_SECRET)에서 주입받는다.
  # 로컬 실행: .env 파일의 JWT_SECRET / 도커 실행: docker-compose environment의 JWT_SECRET
  secret: ${JWT_SECRET}
  expiration: 3600000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG