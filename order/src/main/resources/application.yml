spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 서비스별 커넥션 풀 상한. 전 서비스 합이 MySQL max_connections(도커에서 300으로 상향) 아래가 되도록 20으로 통일.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 1800000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always



  data:
    redis:
      # REDIS_HOST가 없으면(로컬에서 그냥 실행) localhost를 쓰고,
      # 도커에서 실행하면 docker-compose가 REDIS_HOST=redis(컨테이너 이름)를 넣어준다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 10000
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 10000

  cloud:
    openfeign:
      client:
        config:
          default:
            # 예전엔 이 블록이 spring.feign.* 아래 있어서(잘못된 prefix) 타임아웃이 먹지 않았고,
            # 기본값(무한정에 가까움)으로 동작했다. product가 느려지면 order 스레드가 그대로 물렸다.
            connect-timeout: 2000  # 연결 2초
            read-timeout: 3000     # 응답 대기 3초 (이 안에 응답 없으면 실패로 보고 fallback)
            logger-level: BASIC
      circuitbreaker:
        enabled: true        # Feign 호출을 CircuitBreaker로 감싸고, 실패 시 fallbackFactory 실행

  kafka:
    # 예전엔 "localhost:9092"로 고정돼 있었는데, 컨테이너 안에서 localhost는 컨테이너 자기 자신을
    # 가리키므로 도커에서 실행하면 Kafka 브로커(kafka 컨테이너)를 절대 못 찾는다.
    # KAFKA_BOOTSTRAP_SERVERS가 없으면(로컬 실행) localhost:9092, 도커에서는
    # docker-compose가 kafka:29092(컨테이너 간 통신 전용 리스너)를 넣어준다.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer  # 키를 String으로 직렬화
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer  # 값은 JSON 직렬화
      properties:
        spring.json.add.type.headers: true  # 메시지에 타입 헤더 포함
    consumer:
      group-id: order-service  # Order 서비스용 Kafka 컨슈머 그룹 ID
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"  # 모든 패키지에서 DTO 역직렬화 허용

# ── Resilience4j: Feign 호출용 서킷 + 타임리미터 ───────────────────────────────
# 하위 서비스가 연속으로 실패/지연되면 서킷을 열어 한동안 호출 자체를 막고(빠른 실패 + 하위에 숨돌릴 틈),
# wait 시간이 지나면 몇 건만 흘려보내(half-open) 회복됐는지 확인하고 닫는다.
# feign.circuitbreaker의 서킷 이름은 메서드 단위(ProductClientgetProductByIdLong 등)라
# 개별 지정 대신 configs.default로 모든 Feign 클라이언트에 동일 정책을 건다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10          # 최소 10건은 쌓여야 실패율 판정
        failure-rate-threshold: 50           # 최근 20건 중 50% 이상 실패면 open
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80         # 3초 넘는 호출이 80% 이상이어도 open
        wait-duration-in-open-state: 10s     # open 유지 시간
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 재고 부족(409) 같은 4xx는 "정상 거절"이라 서킷 실패로 세지 않는다.
        ignore-exceptions:
          - feign.FeignException$FeignClientException
  timelimiter:
    configs:
      default:
        timeout-duration: 4s               # 서킷이 호출을 기다리는 최대 시간 (read-timeout보다 살짝 길게)
        cancel-running-future: true

management:
  endpoints:
    web:
      exposure:
        include: health, circuitbreakers   # 서킷 상태 관찰용
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30  # 로컬에서 서비스 재기동 시 다른 서비스가 빨리 인지하도록 짧게 (원래 600이라 재시작이 10분간 반영 안 됐음)
    disable-delta: true
    # eureka.client.service-url.defaultZone은 "Eureka 서버가 어디 있는지" 알려주는 주소다.
    # 로컬에서 그냥 실행할 땐 127.0.0.1(내 컴퓨터), 도커로 실행할 땐 eureka-server(컨테이너 이름)를 써야 하는데,
    # 값 하나로 고정해두면 둘 중 하나에서는 무조건 연결이 끊긴다.
    # ${EUREKA_URL:기본값} 문법을 쓰면 EUREKA_URL 환경변수가 있으면 그 값을, 없으면 콜론 뒤 기본값(로컬 주소)을 쓴다.
    # -> docker-compose가 EUREKA_URL=http://eureka-server:8761/eureka를 넣어주면 도커에서 자동으로 전환된다.
    service-url:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8761/eureka}

  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true
    instance-id: order-service:${random.value}
    non-secure-port-enabled: true
    metadata-map:
      instanceId: order-service:${random.value}

# jwt는 eureka 하위가 아니라 최상위 키여야 한다 (들여쓰기 실수로 eureka.jwt.secret이 되어 있었음)
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

server:
  port: 8084