spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always



  data:
    redis:
      # REDIS_HOST가 없으면(로컬에서 그냥 실행) localhost를 쓰고,
      # 도커에서 실행하면 docker-compose가 REDIS_HOST=redis(컨테이너 이름)를 넣어준다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 10000
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 10000

  feign:
    client:
      config:
        default:
          connect-timeout: 5000 # 연결 타임아웃 (밀리초)
          read-timeout: 5000    # 읽기 타임아웃 (밀리초)
          logger-level: FULL    # Feign 통신 로그 출력 수준 (FULL로 하면 요청/응답 모두 확인 가능)

  kafka:
    # 예전엔 "localhost:9092"로 고정돼 있었는데, 컨테이너 안에서 localhost는 컨테이너 자기 자신을
    # 가리키므로 도커에서 실행하면 Kafka 브로커(kafka 컨테이너)를 절대 못 찾는다.
    # KAFKA_BOOTSTRAP_SERVERS가 없으면(로컬 실행) localhost:9092, 도커에서는
    # docker-compose가 kafka:29092(컨테이너 간 통신 전용 리스너)를 넣어준다.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer  # 키를 String으로 직렬화
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer  # 값은 JSON 직렬화
      properties:
        spring.json.add.type.headers: true  # 메시지에 타입 헤더 포함
    consumer:
      group-id: order-service  # Order 서비스용 Kafka 컨슈머 그룹 ID
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"  # 모든 패키지에서 DTO 역직렬화 허용

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 600 # 5??? ??
    disable-delta: true
    # eureka.client.service-url.defaultZone은 "Eureka 서버가 어디 있는지" 알려주는 주소다.
    # 로컬에서 그냥 실행할 땐 127.0.0.1(내 컴퓨터), 도커로 실행할 땐 eureka-server(컨테이너 이름)를 써야 하는데,
    # 값 하나로 고정해두면 둘 중 하나에서는 무조건 연결이 끊긴다.
    # ${EUREKA_URL:기본값} 문법을 쓰면 EUREKA_URL 환경변수가 있으면 그 값을, 없으면 콜론 뒤 기본값(로컬 주소)을 쓴다.
    # -> docker-compose가 EUREKA_URL=http://eureka-server:8761/eureka를 넣어주면 도커에서 자동으로 전환된다.
    service-url:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8761/eureka}

  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true
    instance-id: order-service:${random.value}
    non-secure-port-enabled: true
    metadata-map:
      instanceId: order-service:${random.value}

# jwt는 eureka 하위가 아니라 최상위 키여야 한다 (들여쓰기 실수로 eureka.jwt.secret이 되어 있었음)
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

server:
  port: 8084