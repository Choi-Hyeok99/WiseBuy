spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always

  kafka:
    # 예전엔 "localhost:9092"로 고정돼 있었는데, 컨테이너 안에서 localhost는 컨테이너 자기 자신을
    # 가리키므로 도커에서 실행하면 Kafka 브로커(kafka 컨테이너)를 절대 못 찾는다.
    # KAFKA_BOOTSTRAP_SERVERS가 없으면(로컬 실행) localhost:9092, 도커에서는
    # docker-compose가 kafka:29092(컨테이너 간 통신 전용 리스너)를 넣어준다.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer  # 키를 String으로 직렬화
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer  # 값은 JSON 직렬화
      properties:
        spring.json.add.type.headers: true  # 메시지에 타입 헤더 포함


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30  # 로컬에서 서비스 재기동 시 다른 서비스가 빨리 인지하도록 짧게 (원래 600이라 재시작이 10분간 반영 안 됐음)
    disable-delta: true
    # 로컬 실행/도커 실행에 따라 Eureka 서버 주소가 다르므로(127.0.0.1 vs eureka-server 컨테이너),
    # EUREKA_URL 환경변수가 있으면 그 값을, 없으면 콜론 뒤 기본값(로컬 주소)을 쓰도록 분기한다.
    service-url:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8761/eureka}
  # instance는 eureka.client 밑이 아니라 eureka 바로 아래(client와 같은 레벨)여야 하는 프로퍼티다.
  # client 밑에 잘못 중첩되어 있으면 instance-id, prefer-ip-address 등이 전부 무시되고
  # Eureka에 기본값(호스트명:포트 형태)으로만 등록된다. 여기서 최상위로 옮겨 실제로 적용되게 한다.
  # hostname을 payment 자신이 아니라 "eureka-server"로 박아둔 것도 잘못된 값이라 제거한다
  # (prefer-ip-address: true라 어차피 IP 기준으로 등록되지만, 남겨두면 혼란을 준다).
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true
    instance-id: payment-service:${random.value}
    non-secure-port-enabled: true
    metadata-map:
      instanceId: payment-service:${random.value}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

server:
  port: 8085