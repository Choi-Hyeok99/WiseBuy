spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always

  kafka:
    bootstrap-servers: localhost:9092  # Kafka 서버의 주소 (Docker 환경에서는 localhost:9092 사용)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer  # 키를 String으로 직렬화
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer  # 값은 JSON 직렬화
      properties:
        spring.json.add.type.headers: true  # 메시지에 타입 헤더 포함


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 600
    disable-delta: true
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
    instance:
      hostname: eureka-server
      lease-renewal-interval-in-seconds: 10
      lease-expiration-duration-in-seconds: 30
      prefer-ip-address: true
      instance-id: payment-service:${random.value}
      non-secure-port-enabled: true
      metadata-map:
        instanceId: payment-service:${random.value}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

server:
  port: 8085