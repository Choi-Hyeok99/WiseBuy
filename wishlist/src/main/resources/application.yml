spring:
  application:
    name: wishlist-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 서비스별 커넥션 풀 상한. 전 서비스 합이 MySQL max_connections(도커에서 300으로 상향) 아래가 되도록 20으로 통일.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 1800000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always



  data:
    redis:
      # REDIS_HOST가 없으면(로컬에서 그냥 실행) localhost를 쓰고,
      # 도커에서 실행하면 docker-compose가 REDIS_HOST=redis(컨테이너 이름)를 넣어준다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 10000
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          # 여기 max-wait 값이 "10000   host:"처럼 깨져 있던 걸 복구함 (YAML 파싱/Duration 변환 실패 원인)
          max-wait: 10000

  feign:
    client:
      config:
        default:
          connectTimeout: 5000
          readTimeout: 5000


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30  # 로컬에서 서비스 재기동 시 다른 서비스가 빨리 인지하도록 짧게 (원래 600이라 재시작이 10분간 반영 안 됐음)
    disable-delta: true
    # 로컬 실행/도커 실행에 따라 Eureka 서버 주소가 다르므로(127.0.0.1 vs eureka-server 컨테이너),
    # EUREKA_URL 환경변수가 있으면 그 값을, 없으면 콜론 뒤 기본값(로컬 주소)을 쓰도록 분기한다.
    service-url:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8761/eureka}

  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true
    instance-id: wishlist-service:${random.value}
    non-secure-port-enabled: true
    metadata-map:
      instanceId: wishlist-service:${random.value}

# jwt는 eureka 하위가 아니라 최상위 키여야 한다 (들여쓰기 실수로 eureka.jwt.secret이 되어 있었음)
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

server:
  port: 8083