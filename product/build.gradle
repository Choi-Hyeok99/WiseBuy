plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:2024.0.0"
	}
}

dependencies {
	// 프로젝트 공통 모듈
	implementation project(":common")

	// API 문서 자동화 (Swagger UI): /swagger-ui.html 에서 API 목록 확인 및 직접 호출 테스트 가능
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

	// Spring Boot Starter Dependencies
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-logging'

	// Spring Cloud Dependencies
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

	// Redis (StringRedisTemplate + Lua: 재고 캐시 / 원자적 증감 / 분산 락)
	// 예전엔 redisson-spring-boot-starter가 이 스타터를 전이 의존성으로 끌어와서 동작했는데,
	// RLock 등 Redisson 실사용처가 하나도 없어 스타터를 제거하고 필요한 것만 직접 선언한다.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.1.0'
	implementation 'io.github.resilience4j:resilience4j-retry:2.1.0'


	// Kafka
	implementation 'org.springframework.kafka:spring-kafka'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// MySQL
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 테스트 관련
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 동시성 통합 테스트(ProductStockConcurrencyTest): localhost:6379 Redis 위에서 Lua 스크립트를
	// 그대로 돌려 오버셀이 없는지 검증. Redis가 없으면 테스트를 스킵한다.
}

tasks.named('test') {
	useJUnitPlatform()
}
