spring:
  application:
    name: product-service # 서비스 이름 설정
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always



  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 10000
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 5000

  kafka:
    consumer:
      auto-offset-reset: earliest  # 메시지 손실 방지
      group-id: product-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.sparta.common.dto.KafkaMessage
        spring.json.value.default.type.mapping:
          com.sparta.common.dto.KafkaMessage: com.sparta.product.dto.StockUpdateRequestDto
        spring.json.add.type.headers: true
        session.timeout.ms: 60000         # 예: 60초
        heartbeat.interval.ms: 10000      # 예: 10초
        auto.offset.reset: earliest       # 오프셋이 없을 경우 처음부터 읽기

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds : 600 # 5초마다 갱신
    disable-delta: true
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka

    instance:
      lease-renewal-interval-in-seconds: 10
      lease-expiration-duration-in-seconds: 30
      prefer-ip-address: true
      instance-id: product-service:${random.value}
      non-secure-port-enabled: true
      metadata-map:
        instanceId: product-service:${random.value}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

server:
  port: 8082

  task:
    execution:
      pool:
        core-size: 20
        max-size: 50
        queue-capacity: 100
      shutdown:
        await-termination: true
        await-termination-period: 30s