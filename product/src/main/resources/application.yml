spring:
  application:
    name: product-service # 서비스 이름 설정
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 예전엔 100. 서비스 6개 × 100이면 MySQL 한 대에 커넥션 600개 요구인데 MySQL 기본 max_connections는 151이라
      # 부하만 조금 줘도 "Too many connections"로 터졌다. HikariCP 권장은 (코어수*2 + 디스크수) 수준이라 20이면 충분.
      # connection-timeout도 30s면 풀 고갈 시 요청이 30초 매달리므로, 5초로 줄여 병목이 빨리 드러나게 한다.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 1800000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always



  data:
    redis:
      # REDIS_HOST가 없으면(로컬에서 그냥 실행) localhost를 쓰고,
      # 도커에서 실행하면 docker-compose가 REDIS_HOST=redis(컨테이너 이름)를 넣어준다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 10000
      lettuce:
        pool:
          max-active: 200
          max-idle: 100
          min-idle: 20
          max-wait: 5000

  kafka:
    # product는 원래 bootstrap-servers 설정이 아예 없어서 Spring 기본값(localhost:9092)에 의존하고
    # 있었다. 컨테이너 안에서 localhost는 컨테이너 자기 자신을 가리키므로 도커에서는 절대 Kafka
    # 브로커를 못 찾는다. KAFKA_BOOTSTRAP_SERVERS가 없으면(로컬 실행) localhost:9092, 도커에서는
    # docker-compose가 kafka:29092(컨테이너 간 통신 전용 리스너)를 넣어준다.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      # 기본 리스너는 단건(record) 모드. 배치가 필요한 order.create 컨슈머만 KafkaConfig의
      # batchFactory(setBatchListener(true))를 명시적으로 쓴다. 예전엔 여기 type: batch가 전역이라
      # 단건 시그니처 컨슈머(stock.rollback 등)와 어긋날 소지가 있었다.
      concurrency: 5
    consumer:
      auto-offset-reset: earliest
      group-id: product-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.sparta.product.dto.StockUpdateRequestDto
        session.timeout.ms: 60000
        heartbeat.interval.ms: 10000
        auto.offset.reset: earliest
      max-poll-records: 100
      fetch-min-size: 1048576
      fetch-max-wait-ms: 1000
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 10
      buffer-memory: 33554432
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30  # 로컬에서 서비스 재기동 시 다른 서비스가 빨리 인지하도록 짧게 (원래 600이라 재시작이 10분간 반영 안 됐음)
    disable-delta: true
    # 로컬 실행/도커 실행에 따라 Eureka 서버 주소가 다르므로(127.0.0.1 vs eureka-server 컨테이너),
    # EUREKA_URL 환경변수가 있으면 그 값을, 없으면 콜론 뒤 기본값(로컬 주소)을 쓰도록 분기한다.
    service-url:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8761/eureka}

  # instance는 eureka.client 밑이 아니라 eureka 바로 아래(client와 같은 레벨)여야 하는 프로퍼티다.
  # client 밑에 중첩되어 있으면 instance-id, prefer-ip-address 등이 전부 무시되고
  # Eureka에 기본값(호스트명:포트 형태)으로만 등록된다. 여기서 최상위로 옮겨 실제로 적용되게 한다.
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true
    instance-id: product-service:${random.value}
    non-secure-port-enabled: true
    metadata-map:
        instanceId: product-service:${random.value}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

server:
  port: 8082

  task:
    execution:
      pool:
        core-size: 20
        max-size: 50
        queue-capacity: 100
      shutdown:
        await-termination: true
        await-termination-period: 30s

resilience4j:
  retry:
    instances:
      redis-lock-retry:
        max-attempts: 5    #  최대 재시도 횟수
        wait-duration: 100ms #  재시도 간격
        enable-exponential-backoff: true  # 점진적으로 재시도 간격 증가
        exponential-backoff-multiplier: 1.5 #  점진적 증가 적용
        retry-exceptions:
          - java.lang.IllegalStateException

management:
  endpoints:
    web:
      exposure:
        # "*"로 열어두면 /actuator/env, /actuator/beans 등 내부 설정·빈 정보까지 전부 외부에 노출된다.
        # gateway-service와 동일하게 헬스체크/기본 정보만 노출하도록 제한한다.
        include: health, info
  endpoint:
    retries:
      enabled: true
    resilience4j:
      enabled: true